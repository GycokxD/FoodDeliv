databaseChangeLog:
  - changeSet:
      id: 001 create roles table
      author: denistronin
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: role_name
                  type: varchar(55)
                  constraints:
                    nullable: false
                    unique: true
