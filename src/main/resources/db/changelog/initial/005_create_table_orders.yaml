databaseChangeLog:
  - changeSet:
      id: 005 create table orders
      author: denistronin
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: user_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: double
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            constraintName: fk_orders_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: cascade