spring:
    application:
        name: "FoodDeliv"
    mvc:
        static-path-pattern: /static/**
    freemarker:
        expose-session-attributes: true
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB
    datasource:
        url: ${DB_URL:jdbc:h2:./db/proj;AUTO_SERVER=TRUE}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:qwerty}
        driver-class-name: org.h2.Driver
    liquibase:
        change-log: classpath:/db/changelog/master.yml


    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                generate_statistics: false
                format_sql: true
                show_sql: false


server:
    port: 8089
logging:
    file:
        path: logs
    level:
        root: info