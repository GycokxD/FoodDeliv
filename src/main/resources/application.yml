spring:
    application:
        name: "FoodDeliv"
    mvc:
        static-path-pattern: /static/**
    freemarker:
        expose-session-attributes: true
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB
    datasource:
        url: ${DB_URL:jdbc:h2:./db/proj;AUTO_SERVER=TRUE}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:qwerty}
        driver-class-name: org.h2.Driver
    liquibase:
        change-log: classpath:/db/changelog/master.yml


    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                generate_statistics: false
                format_sql: true
                show_sql: false


maps:
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    osrm-url: ${OSRM_URL:https://router.project-osrm.org}
    osrm-profile: driving
    user-agent: "EduFood-homework/1.0 (+https://github.com/GycokxD/FoodDeliv)"
    country-codes: kg
    center-lat: 42.8746
    center-lng: 74.6122
    search-radius-deg: 0.25
    delivery-radius-km: 15
    timeout-ms: 5000


server:
    port: 8089
logging:
    file:
        path: logs
    level:
        root: info